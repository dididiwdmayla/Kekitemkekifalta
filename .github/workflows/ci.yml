name: CI

# Every push and PR: unit tests, release build and a smoke test of the APK on an emulator.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Testes unitários e APK
        run: ./gradlew --no-daemon --stacktrace :core:test :app:testDebugUnitTest :app:assembleRelease

      - name: Schema do Room precisa estar versionado
        run: |
          # The build regenerates app/schemas; it must match what is committed (needed for migrations).
          fail=0
          for f in $(git ls-files --others --exclude-standard -- app/schemas); do
            echo "::error::Schema novo do Room não commitado: $f"
            cat "$f"
            fail=1
          done
          for f in $(git diff --name-only -- app/schemas); do
            if ! diff <(git show "HEAD:$f" | jq -S .) <(jq -S . "$f") > /dev/null; then
              echo "::error::Schema do Room mudou e não foi commitado: $f"
              git diff -- "$f"
              fail=1
            fi
          done
          exit $fail

      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/
          if-no-files-found: ignore

      - name: Guardar APK
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  smoke:
    name: Teste de fumaça no emulador
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Abrir o app e usar aleatoriamente (monkey)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke.sh

      - name: Logs do teste de fumaça
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs
          path: smoke-*.log
          if-no-files-found: ignore
