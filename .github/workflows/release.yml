name: Release

# Every push to main: signed APK published to the fixed "latest" release (same download link always).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: APK assinado na release latest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build do APK assinado
        env:
          # versionCode sobe sozinho: número da execução deste workflow.
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace :core:test :app:testDebugUnitTest :app:assembleRelease

      - name: Preparar arquivo
        run: cp app/build/outputs/apk/release/*.apk kekitemkekifalta.apk

      - name: Publicar na release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          notes="Versão $VERSION ($(date -u +%Y-%m-%d)), commit ${GITHUB_SHA::7}. Baixe o kekitemkekifalta.apk e instale por cima da versão anterior."
          git tag -f latest
          git push -f origin refs/tags/latest
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest kekitemkekifalta.apk --clobber
            gh release edit latest --title "kekitemkekifalta $VERSION" --notes "$notes" --latest
          else
            gh release create latest kekitemkekifalta.apk --title "kekitemkekifalta $VERSION" --notes "$notes" --latest
          fi
